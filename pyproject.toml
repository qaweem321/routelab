[project]
name = "routelab"
version = "0.0.0"
description = "Fine-tune a small LLM with LoRA to route support-desk requests to the right agent and tool, and prove it with evals."
requires-python = ">=3.12,<3.13"
dependencies = [
  "torch==2.14.1",
  "transformers==5.20.1",
  "peft==0.21.2",
  "accelerate==1.15.0",
  "scikit-learn==1.9.1",
  "fastapi==0.143.3",
  "uvicorn==0.54.0",
]

[project.optional-dependencies]
# 4-bit QLoRA, CUDA only (Kaggle/Colab GPUs). Not needed on a CPU.
qlora = ["bitsandbytes==0.50.2"]

[dependency-groups]
dev = ["pytest==9.1.1", "ruff==0.17.1", "httpx==0.28.1"]

[tool.uv]
package = false
exclude-newer = "2026-10-17T00:00:00Z"

# CPU-only PyTorch: a ~200 MB wheel instead of ~2 GB of CUDA libraries.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S"]
ignore = ["S101"]

[tool.ruff.lint.per-file-ignores]
"routelab/templates.py" = ["E501"]
"routelab/data.py" = ["E501", "S311"]
"routelab/baselines.py" = ["E501"]
"notebooks/*" = ["E501"]
"tests/*" = ["S311", "S603"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
